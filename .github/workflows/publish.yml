name: Publish

# Trusted Publishing: PyPI and TestPyPI trust this workflow, so no API token is stored.
#   A GitHub release published on a v* tag → PyPI, and the files are attached to the release.
#   Run by hand on a branch (Actions → Publish) → a .devN version on TestPyPI.
# The Tag workflow creates the v* tags on merges to main. The version comes from the tag
# (setuptools-scm).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # setuptools-scm needs the tags
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - name: Built version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ ! -f "dist/mfiles_grpc-${GITHUB_REF_NAME#v}.tar.gz" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, but built $(ls dist)"; exit 1
          fi
      - run: twine check --strict dist/*
      # The package must never carry the .proto itself, only the stubs generated from it.
      - name: No .proto in the package
        run: |
          for f in dist/*; do
            if python -m zipfile -l "$f" 2>/dev/null | grep -q '\.proto$' || \
               tar -tzf "$f" 2>/dev/null | grep -q '\.proto$'; then
              echo "::error::$f contains a .proto file"; exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    if: github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  attach:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - run: gh release upload "$GITHUB_REF_NAME" dist/*
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
