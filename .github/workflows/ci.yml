name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: flake8 --max-line-length 120 --extend-exclude src/mfiles_grpc/_generated src tests scripts
      - run: pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: twine check --strict dist/*
      # The package must never carry the .proto itself, only the stubs generated from it.
      - name: No .proto in the package
        run: |
          for f in dist/*; do
            if python -m zipfile -l "$f" 2>/dev/null | grep -q '\.proto$' || \
               tar -tzf "$f" 2>/dev/null | grep -q '\.proto$'; then
              echo "::error::$f contains a .proto file"; exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
