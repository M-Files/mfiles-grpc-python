[build-system]
requires = ["setuptools>=77.0", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "mfiles-grpc"
dynamic = ["version"]
description = "Python client for the M-Files gRPC API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
  { name = "Jari Turkia", email = "jatu@hqcodeshop.fi" }
]
keywords = ["M-Files", "gRPC", "document management", "ECM"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    # The stubs in _generated/ were made with grpcio-tools 1.84.0 (protobuf gencode 7.35.1).
    # Each refuses an older runtime; protobuf also refuses a newer major version.
    "grpcio>=1.84.0",
    "protobuf>=7.35.1,<8",
]

[project.optional-dependencies]
# token-cache = "keyring" remembers the SSO sign-in in the OS credential store.
keyring = [
    "keyring>=25.0",
]
dev = [
    "grpcio-tools>=1.84.0",
    "pytest>=9.0.2",
    "black>=26.3.1",
    "flake8>=7.3.0",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/M-Files/mfiles-grpc-python"
Source = "https://github.com/M-Files/mfiles-grpc-python"
Issues = "https://github.com/M-Files/mfiles-grpc-python/issues"

[project.scripts]
mfiles-grpc = "mfiles_grpc.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
# The version is the latest v* tag, which the Tag workflow creates on every merge to main.
# Between tags it is a .devN version; the local "+g<hash>" part is dropped because PyPI
# and TestPyPI refuse it.
local_scheme = "no-local-version"

[tool.pytest.ini_options]
testpaths = ["tests"]
